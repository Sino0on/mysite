services:
  web:
    build:
      context: .
      args:
        # Вшивается в canonical, hreflang и sitemap при сборке образа.
        # Поменяли адрес — пересоберите: docker compose up -d --build
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Задайте NEXT_PUBLIC_SITE_URL в файле .env}
    image: dastan-portfolio
    restart: unless-stopped
    # Токены Telegram и Resend читаются при запуске, в образ они не попадают.
    env_file: .env
    ports:
      # Слушаем только localhost: наружу сайт отдаст nginx.
      # Docker публикует порты в обход ufw, так что "3000:3000"
      # открыл бы приложение в интернет напрямую.
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ru').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
